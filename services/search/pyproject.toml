[project]
name = "powerpoint-search"
version = "0.1.0"
description = "Private text indexing and retrieval for the PowerPoint library"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "openai>=1.68,<3",
  "pgvector>=0.4,<1",
  "psycopg[binary]>=3.3.6,<3.4",
  "pydantic>=2.10,<3",
  "tokenizers>=0.21,<1",
  "uvicorn>=0.34,<1",
]

[dependency-groups]
dev = ["mypy>=1.15,<2", "pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/search_service"]

[tool.hatch.build.targets.wheel.force-include]
"src/search_service/migrations/001.sql" = "search_service/migrations/001.sql"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
