[project]
name = "powerpoint-extraction"
version = "0.1.0"
description = "Private durable PowerPoint extraction service"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20,<1", "pydantic>=2.10,<3", "python-pptx>=1.0.2,<2", "Pillow>=11,<13"]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "mypy>=1.15,<2", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.mypy]
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
