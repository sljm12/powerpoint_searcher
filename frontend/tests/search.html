<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Search workflow checks</title></head>
<body>
  <main id="app">
    <form id="connect-form"><input id="token" type="password"><button type="submit">Connect</button></form>
    <p id="status" role="status"></p>
    <section id="library" hidden>
      <p id="notes-policy"></p><button id="refresh" type="button">Refresh</button>
      <form id="search-form"><label for="search-query">Query</label><input id="search-query" type="search"><button id="search-submit" type="submit">Search slides</button></form>
      <p id="search-disclosure"></p><p id="search-status" role="status"></p><div id="search-results"></div>
      <form id="upload-form"><input id="deck-file" type="file"><span id="file-name"></span></form>
      <section id="cleanup" hidden><div id="deletion-list"></div></section><div id="decks"></div>
    </section>
    <pre id="fixture-result" role="status">RUNNING</pre>
  </main>
  <script type="module">
    const deckId = "11111111-1111-4111-8111-111111111111";
    const generationId = "22222222-2222-4222-8222-222222222222";
    const assetId = "33333333-3333-4333-8333-333333333333";
    const checksum = "a".repeat(64);
    const png = Uint8Array.from(atob("iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAwMCAO+/S3sAAAAASUVORK5CYII="), (char) => char.charCodeAt(0));
    globalThis.fetch = async (input, init = {}) => {
      const url = new URL(String(input), location.href);
      if (url.pathname.endsWith("/v1/policy")) return Response.json({ include_notes: true,
        search: { state: "ready", profile_id: "fixture-profile", model: "local fixture", location: "local",
          disclosure: "Native slide text, included notes, and queries stay on the local endpoint." } });
      if (url.pathname.endsWith("/v1/decks") && init.method !== "DELETE") return Response.json([]);
      if (url.pathname.endsWith("/v1/deletions")) return Response.json([]);
      if (url.pathname.endsWith("/v1/search")) return Response.json({ query_id: generationId,
        profile_id: "fixture-profile", mode: "hybrid", degraded: false, warnings: [],
        coverage: { eligible_slides: 1 }, next_offset: null, decks: [{ deck_id: deckId,
          filename: "Quarterly plan.pptx", has_more_matches: false, matches: [{ slide_number: 1,
            generation_id: generationId, index_revision: 1, score: 0.04, score_kind: "rrf",
            retrieval_paths: ["lexical", "semantic"], matched_channel: "notes",
            snippet: "<img src=x onerror=alert(1)> battery storage plan", preview_url: `/v1/decks/${deckId}/generations/${generationId}/assets/${assetId}`,
            warning_metadata: [] }] }] });
      if (url.pathname === `/v1/decks/${deckId}`) return Response.json({ deck_id: deckId, filename: "Quarterly plan.pptx",
        source_sha256: checksum, byte_length: 4, source_revision: 1, state: "extracted", operation_id: generationId,
        generation_id: generationId, completed_slides: 1, total_slides: 1, stage: "complete", error: null,
        warnings: [], status_url: `/v1/decks/${deckId}`, manifest_url: `/v1/decks/${deckId}/manifest`,
        original_url: `/v1/decks/${deckId}/original`, search: { state: "ready", index_revision: 1,
          generation_id: generationId, profile_id: "fixture-profile", job_id: generationId,
          completed_segments: 1, total_segments: 1, warnings: [], error: null } });
      if (url.pathname.endsWith("/manifest")) return Response.json({ schema_version: 1, deck_id: deckId,
        source_revision: 1, generation_id: generationId, source_sha256: checksum, source_filename: "Quarterly plan.pptx",
        canonical_original_reference: `/v1/decks/${deckId}/original`, content: { schema_version: 1,
          extractor_version: "fixture", renderer_version: "fixture", config_fingerprint: checksum,
          slides: [{ source: { number: 1, source_slide_id: 1, hidden: false, width: 100, height: 50 },
            notes: null, preview: { asset_local_id: "slide-1", status: "rendered", method: "slide_render", warnings: [] },
            occurrences: [] }] }, assets: [{ asset_id: assetId, local_id: "slide-1", media_type: "image/png",
          role: "slide_preview", pixel_size: [100, 50], byte_length: png.length, sha256: checksum,
          download_url: `/v1/decks/${deckId}/generations/${generationId}/assets/${assetId}` }], warnings: [] });
      if (url.pathname.endsWith(`/assets/${assetId}`)) return new Response(png, { headers: { "content-type": "image/png" } });
      throw new Error(`Unexpected fixture request: ${url.pathname}`);
    };
    const check = (condition, message) => { if (!condition) throw new Error(message); };
    const tick = () => new Promise((resolve) => setTimeout(resolve, 40));
    try {
      await import("../src/main.ts");
      document.querySelector("#token").value = "fixture-library-token-0123456789abcdef";
      document.querySelector("#connect-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
      await tick();
      check(!document.querySelector("#library").hidden, "The page connects through the library client.");
      check(document.querySelector("#search-disclosure").textContent.includes("local endpoint"), "The processing disclosure is visible.");
      document.querySelector("#search-query").value = "battery storage";
      document.querySelector("#search-form").dispatchEvent(new Event("submit", { bubbles: true, cancelable: true }));
      await tick();
      check(document.querySelector(".search-snippet").textContent.includes("<img src=x onerror=alert(1)>"), "Search snippets render as plain text.");
      check(document.querySelector(".search-match img") === null, "Snippet markup cannot create an image element.");
      document.querySelector(".search-match button").click();
      await tick();
      check(document.querySelector("dialog").open, "The selected result opens the gallery slide dialog.");
      check(document.querySelector("dialog").textContent.includes("Slide 1"), "The gallery opens the exact matched slide.");
      document.querySelector("dialog").close();
      document.querySelector(".gallery .button").click();
      await tick();
      check(!document.querySelector("#library").hidden, "Closing the gallery restores the library page.");
      document.querySelector("#fixture-result").textContent = "PASS: disclosure, safe snippet, authenticated preview, exact-slide gallery";
    } catch (error) {
      document.querySelector("#fixture-result").textContent = `FAIL: ${error instanceof Error ? error.message : String(error)}`;
      throw error;
    }
  </script>
</body>
</html>
